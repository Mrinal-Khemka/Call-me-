<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question for Swikriti</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            z-index: 10;
        }
        h1 {
            color: #ff4d4d;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            margin-bottom: 40px;
            line-height: 1.3;
        }
        .buttons {
            position: relative;
            height: 60px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        button {
            font-size: clamp(1rem, 4vw, 1.2rem);
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            touch-action: manipulation;
        }
        #yes-btn {
            background-color: #4CAF50;
            position: absolute;
            left: 10px;
            top: 0;
        }
        #no-btn {
            background-color: #ff4d4d;
            position: absolute;
            right: 10px;
            top: 0;
            transition: top 0.2s ease, left 0.2s ease;
        }
        #success-msg {
            display: none;
            color: #d81b60;
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }
        #success-msg h2 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 15px;
        }
        #success-msg p {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
        }
    </style>
</head>
<body>

    <div class="container" id="question-container">
        <h1>Swikriti, will you call Mrinal?</h1>
        <div class="buttons">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div id="success-msg">
        <h2>Yay! 🎉</h2>
        <p>I'm waiting for your call.</p>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const questionContainer = document.getElementById('question-container');
        const successMsg = document.getElementById('success-msg');

        function dodgeButton() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            const padding = 20;
            const maxX = Math.max(0, windowWidth - btnWidth - padding);
            const maxY = Math.max(0, windowHeight - btnHeight - padding);

            const randomX = Math.floor(Math.random() * maxX) + (padding / 2);
            const randomY = Math.floor(Math.random() * maxY) + (padding / 2);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', dodgeButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            dodgeButton();
        });

        yesBtn.addEventListener('click', () => {
            questionContainer.style.display = 'none';
            successMsg.style.display = 'block';
        });
    </script>
</body>
</html>
