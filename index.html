<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question for Swikriti</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff4d4d;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 30px;
            line-height: 1.3;
        }
        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
            width: 100%;
            min-height: 100px;
        }
        button {
            font-size: 1.2rem;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            touch-action: manipulation;
            transition: all 0.2s ease;
        }
        #yes-btn {
            background-color: #4CAF50;
            z-index: 5;
        }
        #no-btn {
            background-color: #ff4d4d;
            position: relative;
            z-index: 10;
        }
        #success-msg {
            display: none;
            color: #d81b60;
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }
        #success-msg h2 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 15px;
        }
        #success-msg p {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
        }
        .gif-container {
            margin-bottom: 20px;
        }
        .gif-container img {
            max-width: 200px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container" id="question-container">
        <div class="gif-container">
            <!-- Cute bear pleading GIF -->
            <img src="https://media.tenor.com/efhiP0mcuWMAAAAi/tkthao219-bubududu.gif" alt="Cute bear asking">
        </div>
        <h1>Swikriti, will you call me?</h1>
        <div class="buttons">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div id="success-msg">
        <div class="gif-container">
            <!-- Happy hugging bears GIF -->
            <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Happy bear">
        </div>
        <h2>Yay! 🎉</h2>
        <p>I'm waiting for your call.</p>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const questionContainer = document.getElementById('question-container');
        const successMsg = document.getElementById('success-msg');

        // The messages that will cycle when she tries to click "No"
        const messages = [
            "No",
            "Are you sure?",
            "Swikriti please!",
            "Sorry! Just say yes!",
            "Think about it!",
            "If you say no, I will be sad...",
            "I will be very very sad...",
            "Ok fine, I will stop asking...",
            "Just kidding, PLEASE say yes!",
            "You are breaking my heart ;("
        ];

        let messageIndex = 0;
        let yesButtonSize = 1.2; // Starting font size in rem
        let yesButtonPadding = 12; // Starting vertical padding

        function handleNoClick() {
            // 1. Change the text of the No button
            messageIndex = Math.min(messageIndex + 1, messages.length - 1);
            noBtn.innerText = messages[messageIndex];

            // 2. Make the Yes button bigger and bigger
            yesButtonSize += 0.4;
            yesButtonPadding += 6;
            yesBtn.style.fontSize = `${yesButtonSize}rem`;
            yesBtn.style.padding = `${yesButtonPadding}px ${yesButtonPadding * 2.5}px`;

            // 3. Make the No button run away
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            const padding = 20;
            const maxX = Math.max(0, windowWidth - btnWidth - padding);
            const maxY = Math.max(0, windowHeight - btnHeight - padding);

            const randomX = Math.floor(Math.random() * maxX) + (padding / 2);
            const randomY = Math.floor(Math.random() * maxY) + (padding / 2);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Trigger on both hover (desktop) and tap (mobile)
        noBtn.addEventListener('mouseover', handleNoClick);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleNoClick();
        });

        // Action when she finally clicks "Yes"
        yesBtn.addEventListener('click', () => {
            questionContainer.style.display = 'none';
            successMsg.style.display = 'block';
        });
    </script>
</body>
</html>
